<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!--
      Lock the viewport at 1× and disable pinch-zoom. This app is an
      installable POS shell, not a scrollable document — zoom only ever left
      the sticky header and cart misaligned. `user-scalable=no` +
      `maximum-scale=1.0` stops the pinch gesture on both iOS and Android.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Mekholi — a universal retail POS platform with a plugin architecture." />
    <!--
      Relative build assets need a stable root when the service worker serves
      this shell for a History API deep link. The worker replaces this value
      with its deployment scope; at the entry point `./` is already correct.
    -->
    <base href="./" />
    <meta name="application-name" content="Mekholi POS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mekholi" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Mekholi</title>

    <!--
      Icon sets (§37). Material Symbols Rounded is the primary interface set;
      Font Awesome 6 fills gaps and provides brand glyphs. Both are loaded
      with `display=block` / non-render-blocking patterns so a slow CDN
      degrades to invisible icons rather than a blank screen.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    />

    <!--
      Kalpurush is the Bengali typeface for this product (docs/16). Inter has
      no Bengali glyphs, so Bengali text falls through to Kalpurush while Latin
      stays in Inter. Self-hosted webfont CDN; a slow CDN degrades to Hind
      Siliguri rather than a blank screen.
    -->
    <link rel="preconnect" href="https://fonts.maateen.me" crossorigin />
    <link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css" />

    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
  </head>
  <body class="h-full bg-surface text-content antialiased">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
