<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mekholi</title>
    <script>
      // GitHub Pages has no server rewrite for History API routes. Preserve the
      // requested path, return to the app entry point, and let the router
      // restore it with replaceState. No hash route is created.
      (function () {
        var base = '/Mekholi/'
        var path = window.location.pathname.indexOf(base) === 0
          ? window.location.pathname.slice(base.length)
          : window.location.pathname.replace(/^\/+/, '')
        var destination = '/' + path + window.location.search
        try {
          sessionStorage.setItem('mekholi.page-redirect', JSON.stringify({
            path: '/' + path,
            search: window.location.search,
          }))
        } catch (_) {
          // The query hand-off below also works when storage is disabled.
        }
        // Carry the route in the URL as well as sessionStorage. Some privacy
        // modes isolate storage on a 404 response; the explicit hand-off makes
        // the deep link deterministic there and in automated browsers.
        window.location.replace(base + '?__mekholi_route=' + encodeURIComponent(destination))
      })()
    </script>
  </head>
  <body></body>
</html>
