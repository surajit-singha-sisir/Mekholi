# Dependency update automation (audit F-12).
#
# The point here is not to auto-merge everything. It is to make the two
# upgrades that currently sit behind every open advisory — Tailwind 3 → 4 and
# Vite 5 → 8 — arrive as reviewable pull requests on a schedule, instead of
# being discovered by an auditor months later.
#
# Patch and minor updates are grouped so routine churn is one PR a week.
# Majors are raised individually, because each one needs a human decision:
# Tailwind 4 is a CSS-first config rewrite, and Vite 8 changes the minimum
# Node version. Neither belongs in an unattended merge.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels: [dependencies]
    groups:
      # Routine, low-risk churn in one PR. Because each group is restricted
      # to minor+patch, majors do not match any group and Dependabot raises
      # them as individual PRs automatically — which is what we want.
      #
      # NOTE: do NOT add `ignore: dependency-name: '*' / semver-major` here.
      # `ignore` suppresses the update entirely, it does not merely exclude
      # it from a group. The first version of this file did exactly that and
      # would have silently prevented the Tailwind 4 and Vite 8 PRs that
      # audit F-12 depends on from ever being raised.
      dev-tooling-minor:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]

  # Pinned action versions age badly and are a real supply-chain surface:
  # a compromised action runs with the deploy workflow's permissions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies, ci]
