name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── Supply chain (audit F-12) ─────────────────────────────────────
      # The gate is on *runtime* dependencies, because those are the only
      # ones that reach a merchant's browser. Today that is exactly one
      # package (@supabase/supabase-js) and it is clean, so this step is a
      # tripwire: it fails the moment a vulnerable package enters the
      # shipped bundle.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev/build tooling is reported but does not fail the build, because
      # the current advisories have no non-breaking fix:
      #
      #   braces <=3.0.3    GHSA-vfj7-8cjw-p6xm — 3.0.3 IS the latest release;
      #                     no patched version exists. Reaches us only through
      #                     tailwindcss@3 → chokidar@3. Clearing it requires
      #                     Tailwind 4, which is a CSS-first config rewrite.
      #   vite <=6.4.2      Path traversal in `.map`; two further advisories
      #                     are Windows-only dev-server issues and CI is
      #                     Ubuntu. Fix is vite@8 — a major upgrade.
      #   esbuild <=0.24.2  Dev-server CORS. Pinned by vite@5.
      #
      # None execute in CI's build path or ship to users. Dependabot (see
      # .github/dependabot.yml) raises the major upgrades as reviewable PRs
      # so they are scheduled deliberately rather than rushed before a pilot.
      # Revisit this exception whenever the list above changes.
      - name: Audit all dependencies (report only)
        run: npm audit || true

      # Strict TypeScript, no `any` (spec §59).
      - name: Typecheck
        run: npm run typecheck

      # Style plus the glob-level import boundaries.
      - name: Lint
        run: npm run lint

      # Resolves every import to a real path and enforces the layer rules.
      # This is the check behind "adding a plugin requires zero edits under
      # src/features/" — a plugin that cannot reach src/features/ cannot fork
      # the sales engine (spec §51).
      - name: Architecture boundaries
        run: npm run check:boundaries

      # Kernel unit tests: event bus, plugin registry, permission matching.
      - name: Unit tests
        run: npm run test

      # The generated API contract, against both clients. Offline and instant:
      # every RPC name and parameter the web client and the Kotlin reference
      # send has to exist in `contracts/api-contract.json`, so a rename fails
      # here rather than in a shop.
      - name: Clients speak the contract
        run: npm run check:clients

      # The Android reference's core is Kotlin/JVM, so it compiles and runs
      # here. The compiler is downloaded once into the runner's cache; the
      # `app` module needs the Android SDK and is not built (see android/README).
      - name: Android core tests
        run: npm run test:android

      # Applies every migration and seed to a real Postgres (WASM) and runs the
      # structural, behavioral and end-to-end assertions, including a full
      # complete_sale against the seeded organization.
      - name: Validate migrations
        run: npm run validate:migrations

      - name: Build
        run: npm run build
